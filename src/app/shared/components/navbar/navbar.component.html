<nav class="navbar">
  <div class="navbar-brand">
    <i class="fas fa-cubes logo-icon"></i>
    <span class="logo-text">3D Store</span>
  </div>

  <!-- Botón Menú Hamburguesa (visible solo en móvil) -->
  <button class="menu-toggle" (click)="toggleMenu()" aria-label="Abrir menú">
    <i class="fas" [class.fa-bars]="!isMenuOpen" [class.fa-times]="isMenuOpen"></i>
  </button>

  <!-- Agregamos la clase dinámica [class.show] -->
  <ul class="nav-links" [class.show]="isMenuOpen">
    <li>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">
        <i class="fas fa-home"></i> Inicio
      </a>
    </li>
    <li>
      <a routerLink="/catalogo/figuras" routerLinkActive="active" (click)="closeMenu()">
        <i class="fas fa-dragon"></i> Figuras
      </a>
    </li>
    <li>
      <a routerLink="/catalogo/llaveros" routerLinkActive="active" (click)="closeMenu()">
        <i class="fas fa-key"></i> Llaveros
      </a>
    </li>
    <li>
      <a routerLink="/catalogo/utensilios-cocina" routerLinkActive="active" (click)="closeMenu()">
        <i class="fas fa-utensils"></i> Utensilios
      </a>
    </li>
    <li>
      <a routerLink="/catalogo/herramientas" routerLinkActive="active" (click)="closeMenu()">
        <i class="fas fa-tools"></i> Herramientas
      </a>
    </li>
    <li>
      <a routerLink="/catalogo/repuestos-auto" routerLinkActive="active" (click)="closeMenu()">
        <i class="fas fa-car-side"></i> Repuestos
      </a>
    </li>
    <li>
      <a routerLink="/contacto" routerLinkActive="active" (click)="closeMenu()">
        <i class="fas fa-envelope"></i> Contacto
      </a>
    </li>
  </ul>
</nav>
